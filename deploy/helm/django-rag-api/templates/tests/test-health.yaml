apiVersion: v1
kind: Pod
metadata:
  name: {{ include "rag.fullname" . }}-test-health
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext: {{- include "rag.podSecurityContext" . | nindent 4 }}
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      args:
        - -fsSL
        - --max-redirs
        - "0"
        - --fail-early
        - -H
        - "Host: {{ .Values.host }}"
        - http://{{ include "rag.fullname" . }}:{{ .Values.service.port }}/api/v1/health/live/
        - http://{{ include "rag.fullname" . }}:{{ .Values.service.port }}/api/v1/health/
      securityContext: {{- include "rag.containerSecurityContext" . | nindent 8 }}
