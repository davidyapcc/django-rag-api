name: Release

# A v* tag publishes the image and the chart to GHCR at the same version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/django-rag-api
          docker build -t $IMAGE:$VERSION .
          docker push $IMAGE:$VERSION
          if [[ "$VERSION" != *-* ]]; then
            docker tag $IMAGE:$VERSION $IMAGE:latest
            docker push $IMAGE:latest
          fi
      - uses: azure/setup-helm@v4
      - name: Chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm package deploy/helm/django-rag-api --version $VERSION --app-version $VERSION
          helm push django-rag-api-$VERSION.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
